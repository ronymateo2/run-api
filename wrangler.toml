name = "run-api"
main = "src/index.ts"
compatibility_date = "2025-10-08"
compatibility_flags = ["nodejs_compat"]

[observability]
enabled = true

[[d1_databases]]
binding = "DB"
database_name = "rurana-db"
database_id = "b11141de-140a-4e55-bbd9-4cdeb8eeacf9"

[triggers]
# Hourly — the reminder logic filters by each user's local hour + focus days.
crons = ["0 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://run-web.ronymateo.workers.dev"
APP_URL = "https://run-web.ronymateo.workers.dev"
VAPID_SUBJECT = "mailto:ronymateo@gmail.com"
# Public VAPID key (base64url, uncompressed P-256 point). Private key is a secret:
#   wrangler secret put VAPID_PRIVATE_KEY
VAPID_PUBLIC_KEY = "BBP0Qx2kmvziNOKpLU2AIgFGE-9a-IwcPWtwGOeeOysq-aUJhE4OiQSR15tMvsvCCPNENbCPUFPKlosR9ct12Qk"

# Rate limit auth endpoint: 10 requests / 60s per client IP
[[unsafe.bindings]]
name = "AUTH_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1001"
simple = { limit = 10, period = 60 }

# Rate limit sync endpoints: 120 requests / 60s per user. A sync cycle is one push
# + a few pull pages; this only throttles runaway retry loops.
[[unsafe.bindings]]
name = "SYNC_RATE_LIMITER"
type = "ratelimit"
namespace_id = "1002"
simple = { limit = 120, period = 60 }
